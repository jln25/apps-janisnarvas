<body>

<!-- Sticky navigation, filled in by nav.js. -->
<nav class="site-nav" data-root-prefix="../"></nav>

<!-- Names the tool; the page's H1 lives here. -->
<section class="tool-banner">
  <div class="tool-banner-inner">
    <h1>Word Bank</h1>
    <p class="tool-desc">Words and phrases to inspire your copy</p>
  </div>
</section>

<main class="wb">

  <p class="wb-intro">Stuck on a headline or button label? Filter by mood, industry, and page section to find words that fit the copy you're writing, then click any word to copy it.</p>

  <!-- The search and the dropdowns stay pinned under the nav while the results
       scroll (on phones only the dropdowns do). A search that matches a
       category sets its dropdown; one that matches nothing offers Datamuse. -->
  <form id="search-form" class="wb-search" role="search">
    <label class="wb-label" for="search-input">Search a mood, industry or page section</label>
    <input type="search" id="search-input" list="search-suggest" autocomplete="off" spellcheck="false"
           placeholder="luxury, attorney, pricing page…">
    <datalist id="search-suggest"></datalist>
  </form>

  <section class="wb-pickers" aria-label="Categories">
    <div class="picker">
      <label class="wb-label" for="pick-mood1">Mood</label>
      <select id="pick-mood1" data-slot="mood1"></select>
      <button type="button" id="add-mood-btn" class="btn-link" hidden>+ Add a second mood</button>
    </div>
    <div class="picker" id="mood2-field" hidden>
      <label class="wb-label" for="pick-mood2">Second mood</label>
      <select id="pick-mood2" data-slot="mood2"></select>
    </div>
    <div class="picker">
      <label class="wb-label" for="pick-industry">Industry</label>
      <select id="pick-industry" data-slot="industry"></select>
    </div>
    <div class="picker">
      <label class="wb-label" for="pick-context">Page section</label>
      <select id="pick-context" data-slot="context"></select>
    </div>
    <button type="button" id="clear-btn" class="btn-link wb-clear" hidden>Clear all</button>
  </section>

  <!-- Shown when a search matches no category. -->
  <section id="no-match" class="wb-no-match" hidden>
    <p id="no-match-text"></p>
    <button type="button" id="datamuse-btn" class="btn btn-secondary">Find rough suggestions</button>
    <div id="datamuse-results"></div>
  </section>

  <!-- Results for the selection, one card per category, then the combined avoid list. -->
  <section id="results" class="wb-results"></section>

</main>

<!-- Confirms a copied word. -->
<div id="toast" class="wb-toast" role="status" aria-live="polite" hidden></div>

<!-- Licensing bar, filled in by sitebar.js. -->
<footer class="site-bar" data-root-prefix="../"></footer>

<script src="data/moods.js?v=4.4.0"></script>
