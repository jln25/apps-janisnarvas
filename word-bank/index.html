<body>

<!-- Sticky navigation, filled in by nav.js. -->
<nav class="site-nav" data-root-prefix="../"></nav>

<!-- Names the tool; the page's H1 lives here. -->
<section class="tool-banner">
  <div class="tool-banner-inner">
    <h1>Word Bank</h1>
    <p class="tool-desc">Words, phrases, and words to inspire</p>
  </div>
</section>

<main class="wb">

  <!-- Search filters the categories below as you type. A search that matches
       no category offers rougher suggestions from Datamuse instead. -->
  <form id="search-form" class="wb-search" role="search">
    <label class="wb-label" for="search-input">Search a mood, industry or page section</label>
    <div class="wb-search-row">
      <input type="search" id="search-input" autocomplete="off" spellcheck="false"
             placeholder="luxury, accounting, pricing page…">
    </div>
    <p class="wb-hint">Pick up to three, for example an industry, a mood and a page section. Click any word to copy it.</p>
  </form>

  <!-- What is selected. Empty until the first pick. -->
  <section id="selected" class="wb-selected" aria-label="Selected categories" hidden>
    <div id="selected-chips" class="wb-selected-chips"></div>
    <button type="button" id="clear-btn" class="btn-link">Clear all</button>
  </section>

  <!-- Results for the selection, one card per category, then the combined avoid list. -->
  <section id="results" class="wb-results"></section>

  <!-- Every category, grouped. Filtered by the search box. -->
  <section id="browse" class="wb-browse" aria-label="All categories"></section>

  <!-- Shown when a search matches no category. -->
  <section id="no-match" class="wb-no-match" hidden>
    <p id="no-match-text"></p>
    <button type="button" id="datamuse-btn" class="btn btn-secondary">Find rough suggestions</button>
    <div id="datamuse-results"></div>
  </section>

</main>

<!-- Confirms a copied word. -->
<div id="toast" class="wb-toast" role="status" aria-live="polite" hidden></div>

<!-- Licensing bar, filled in by sitebar.js. -->
<footer class="site-bar" data-root-prefix="../"></footer>
