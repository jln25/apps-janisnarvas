<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janis Narvas | BAMS Planner</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=1.0.0">
<link rel="icon" type="image/png" sizes="512x512" href="../favicon-512.png?v=1.0.0">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=1.0.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1.0.0">
<!-- Loaded in <head> so the theme is set before first paint (no light flash). -->
<script src="../theme.js?v=1.0.0"></script>
<!-- Google Analytics (GA4) -->
<script src="../analytics.js?v=1.0.0"></script>
</head>
<body>

<header class="app-header no-print">
  <a href="../" class="home-link" aria-label="Back to all tools">&larr; All tools</a>
  <h1 class="app-title">BAMS Planner</h1>
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch theme">&#9790;</button>
  <div class="header-actions">
    <button type="button" id="export-csv-btn" class="btn btn-ghost">Export CSV</button>
    <button type="button" id="export-pdf-btn" class="btn btn-ghost">Export PDF</button>
  </div>
</header>

<main>

  <!-- DASHBOARD -->
  <section class="dashboard">
    <div class="dashboard-headline">
      <div>
        <span class="dashboard-headline-label">Total progress</span>
        <h2 id="dashboard-total-text">0 / 142 units</h2>
      </div>
      <span id="dashboard-total-pct" class="dashboard-pct">0%</span>
    </div>
    <div class="progress-bar progress-bar-lg">
      <div id="dashboard-total-bar" class="progress-bar-fill"></div>
    </div>

    <div id="dashboard-groups" class="dashboard-groups"></div>

    <div class="dashboard-nongwa">
      <h3>Mandated, non-GWA requirements</h3>
      <div id="dashboard-nongwa-list" class="dashboard-nongwa-list"></div>
    </div>
  </section>

  <!-- COURSE LIST CONTROLS -->
  <section class="list-controls no-print">
    <select id="category-filter" aria-label="Filter by category">
      <option value="all">All categories</option>
    </select>
    <select id="status-filter" aria-label="Filter by status">
      <option value="all">All statuses</option>
      <option value="none">No status</option>
      <option value="planned">Planned</option>
      <option value="in-progress">In progress</option>
      <option value="completed">Completed</option>
    </select>
  </section>

  <!-- COURSE LIST -->
  <section class="course-list-section">
    <div id="course-list" class="course-list"></div>
  </section>

</main>

<!-- Print-only header, populated by script.js right before printing -->
<div id="print-header" class="print-only"></div>

<!-- Version + copyright bar, filled in by sitebar.js (year is generated). -->
<footer class="site-bar no-print" data-app-version="1.0.0"></footer>

<script src="courses.js?v=1.0.0"></script>
<script src="script.js?v=1.0.0"></script>
<script src="../sitebar.js?v=1.0.0"></script>
</body>
</html>
