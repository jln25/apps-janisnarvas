<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janis Narvas — Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Loaded in <head> so the theme is set before first paint (no light flash). -->
<script src="theme.js"></script>
</head>
<body>

<header class="site-header">
  <span class="site-title">apps.janisnarvas.com</span>
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch theme">&#9790;</button>
</header>

<main>
  <section class="intro">
    <h1>A small collection of personal tools for students</h1>
    <p>Standalone web apps, no login required. Data stays in your browser.</p>
  </section>

  <!--
    Each tool is a card driven by the TOOLS array in script.js.
    To add a new tool later: add an entry to that array — no HTML edits needed.
  -->
  <section id="tool-grid" class="tool-grid"></section>
</main>

<footer class="site-footer">
  <span>Built in Los Baños, Laguna ♡</span>
</footer>

<script src="script.js"></script>
</body>
</html>
