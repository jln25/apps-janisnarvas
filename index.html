<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janis Narvas | Apps</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1.0.0">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png?v=1.0.0">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1.0.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1.0.0">
<!-- Loaded in <head> so the theme is set before first paint (no light flash). -->
<script src="theme.js?v=1.0.0"></script>
<!-- Google Analytics (GA4) -->
<script src="analytics.js?v=1.0.0"></script>
</head>
<body>

<header class="site-header">
  <a href="./" class="site-home" title="Study Apps — home" aria-label="Study Apps — home">🏠</a>
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch theme">&#9790;</button>
</header>

<main>
  <section class="intro">
    <h1>A small collection of personal tools for students</h1>
    <p>Standalone web apps, no login required. Data stays in your browser.</p>
  </section>

  <!--
    Each tool is a card driven by the TOOLS array in script.js.
    To add a new tool later: add an entry to that array — no HTML edits needed.
  -->
  <section id="tool-grid" class="tool-grid"></section>
</main>

<footer class="site-footer">
  <p>Designed in Los Baños, Laguna ♡</p>
  <p>Found a bug? <a href="https://janisnarvas.com/contact">Send me a message.</a></p>
</footer>

<!-- Version + copyright bar, filled in by sitebar.js (year is generated). -->
<footer class="site-bar" data-app-version="1.0.0"></footer>

<script src="script.js?v=1.0.0"></script>
<script src="sitebar.js?v=1.0.0"></script>
</body>
</html>
