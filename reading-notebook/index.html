<body>

<!-- Sticky navigation, filled in by nav.js. -->
<nav class="site-nav" data-root-prefix="../"></nav>

<!-- Names the tool; the page's H1 lives here. -->
<section class="tool-banner">
  <div class="tool-banner-inner">
    <h1>Reading Notebook</h1>
    <p class="tool-desc">Tagged notes on academic sources, exportable to Markdown or CSV.</p>
  </div>
</section>

<div class="app-shell">

  <aside class="sidebar">
    <button type="button" id="new-note-btn" class="btn btn-primary btn-block">+ New Note</button>

    <input type="search" id="search-input" placeholder="Search by title…" aria-label="Search notes">

    <div class="sidebar-section">
      <div class="sidebar-section-header">
        <h2>Tags</h2>
        <button type="button" id="clear-tag-filter-btn" class="btn-link" hidden>Clear</button>
      </div>
      <div id="tag-cloud" class="tag-cloud"></div>
    </div>

    <div class="sidebar-section sidebar-footer">
      <button type="button" id="export-all-md-btn" class="btn btn-ghost btn-block">Export all → .zip (Markdown)</button>
      <button type="button" id="export-all-csv-btn" class="btn btn-ghost btn-block">Export all → CSV</button>
    </div>
  </aside>

  <main class="main-content">

    <!-- LIST VIEW -->
    <section id="list-view" class="view">
      <div id="active-filter-banner" class="active-filter-banner" hidden></div>
      <div id="note-list" class="note-list"></div>
      <p id="list-empty-msg" class="empty-msg" hidden>No notes yet — click “+ New Note” to start your notebook.</p>
    </section>

    <!-- DETAIL VIEW -->
    <section id="detail-view" class="view" hidden>
      <div class="detail-toolbar">
        <button type="button" id="back-to-list-btn" class="btn btn-ghost">&larr; Back</button>
        <div class="detail-toolbar-actions">
          <button type="button" id="export-note-md-btn" class="btn btn-ghost">Export .md</button>
          <button type="button" id="edit-note-btn" class="btn btn-secondary">Edit</button>
          <button type="button" id="delete-note-btn" class="btn btn-danger">Delete</button>
        </div>
      </div>
      <article id="note-detail-content" class="note-detail"></article>
    </section>

    <!-- ADD / EDIT FORM VIEW -->
    <section id="form-view" class="view" hidden>
      <form id="note-form">
        <input type="hidden" id="note-id">

        <label class="field-label" for="note-title">Title</label>
        <input type="text" id="note-title" required placeholder="What is this study/article/lecture about?">

        <label class="field-label" for="note-tags">Tags</label>
        <input type="text" id="note-tags" placeholder="#collective-mind #dev-comm #flor">

        <div id="rich-fields-container"></div>

        <div class="form-actions">
          <button type="button" id="cancel-form-btn" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Note</button>
        </div>
      </form>
    </section>

  </main>
</div>

<!-- Licensing bar, filled in by sitebar.js. -->
<footer class="site-bar" data-root-prefix="../"></footer>
